name: ac-implementation
services:
  native-dispatch-controller-proof:
    profiles: [native-dispatch]
    image: agent-control-lab:0.1.0
    init: true
    user: '${AC_LAB_UID:-1000}:${AC_LAB_GID:-1000}'
    group_add: ['${AC_LAB_DOCKER_GID:-999}']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    networks: [lab]
    working_dir: /home/app/projects/agent-control-implementation
    command: [node, --import, tsx, --test, tests/native-dispatch.test.ts]
    environment:
      AC_TEST_DATABASE_URL: postgresql://ac_lab:synthetic-lab-only@db:5432/ac_implementation_test
      AC_NATIVE_DISPATCH_ROOT: /home/app/projects/agent-control-implementation/.state/native-dispatch-physical
      CEZ_HOME: /home/app/projects/agent-control-implementation/.state/native-dispatch-physical/cezar-home
      CEZ_AUTONAME: '0'
      CEZ_AUTOMATIONS: '0'
      CEZ_TELEMETRY: '0'
      CEZ_SKILLS_AUTO_UPDATE: '0'
      CEZ_NO_BANNER: '1'
      HOME: /tmp
    volumes:
      - ..:/home/app/projects/agent-control-implementation:ro
      - ../.state/native-dispatch-physical:/home/app/projects/agent-control-implementation/.state/native-dispatch-physical:rw
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db: {condition: service_healthy}
  native-qa-controller-proof:
    profiles: [qa-physical]
    image: agent-control-lab:0.1.0
    user: '0:0'
    init: true
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    networks: [lab]
    working_dir: /home/app/projects/agent-control-implementation
    command: [node, --import, tsx, --test, tests/native-qa-physical.test.ts]
    environment:
      AC_TEST_DATABASE_URL: postgresql://ac_lab:synthetic-lab-only@db:5432/ac_implementation_test
      AC_QA_PHYSICAL_ROOT: /home/app/projects/agent-control-implementation/.state/native-qa-physical
      HOME: /tmp
    volumes:
      - ..:/home/app/projects/agent-control-implementation:ro
      - ../.state/native-qa-physical:/home/app/projects/agent-control-implementation/.state/native-qa-physical:rw
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db: {condition: service_healthy}
  native-tools-proof:
    profiles: [native-pair]
    image: agent-control-native-tools:0.1.0
    user: '${AC_LAB_UID:-1000}:${AC_LAB_GID:-1000}'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    pids_limit: 96
    networks: [native-pair]
    tmpfs: ['/tmp:rw,nosuid,nodev,size=64m']
    volumes:
      - ${AC_NATIVE_PAIR_FIXTURE:-/nonexistent-ac-native-pair}/work:/work:ro
      - ${AC_NATIVE_PAIR_FIXTURE:-/nonexistent-ac-native-pair}/tools-token:/runner/exec-token:ro
  native-client-proof:
    profiles: [native-pair]
    image: agent-control-lab:0.1.0
    user: '${AC_LAB_UID:-1000}:${AC_LAB_GID:-1000}'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    pids_limit: 96
    networks: [native-pair]
    tmpfs: ['/tmp:rw,nosuid,nodev,size=64m']
    working_dir: /tmp
    volumes:
      - ../scripts/prove-native-pair-protocol.mjs:/proof.mjs:ro
      - ${AC_NATIVE_PAIR_FIXTURE:-/nonexistent-ac-native-pair}/native-tool-forwarder.mjs:/forwarder.mjs:ro
      - ${AC_NATIVE_PAIR_FIXTURE:-/nonexistent-ac-native-pair}/worker-token:/runner/exec-token:ro
      - ${AC_NATIVE_CODEX_BINARY:-/nonexistent-agent-control-public-codex-binary}:/native/codex:ro
    command: [node, /proof.mjs]
    depends_on:
      native-tools-proof: {condition: service_started}
  native-protocol-proof:
    profiles: [native-protocol]
    image: agent-control-lab:0.1.0
    user: '${AC_LAB_UID:-1000}:${AC_LAB_GID:-1000}'
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    pids_limit: 96
    tmpfs: ['/tmp:rw,nosuid,nodev,size=64m']
    working_dir: /workspace
    volumes:
      - ../scripts/prove-native-remote-protocol.mjs:/workspace/prove.mjs:ro
      - ${AC_NATIVE_CODEX_BINARY:-/nonexistent-agent-control-public-codex-binary}:/native/codex:ro
    command: [node, /workspace/prove.mjs]
  ssh-fixture-init:
    profiles: [ssh-test]
    image: agent-control-ssh-lab:0.1.0
    user: '0:0'
    network_mode: none
    volumes: ['..:/workspace:ro','ssh-fixture-keys:/fixtures']
    working_dir: /workspace
    command: [node, scripts/prepare-ssh-fixtures.mjs]
  ssh-host-a:
    profiles: [ssh-test]
    image: agent-control-ssh-lab:0.1.0
    user: '0:0'
    read_only: true
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    networks: [lab]
    tmpfs: ['/run:rw,nosuid,nodev,size=8m','/tmp:rw,noexec,nosuid,nodev,size=8m']
    volumes:
      - ssh-fixture-keys:/fixtures:ro
      - ssh-host-a-state:/projects
      - ../services/remote-worker/worker.py:/usr/local/lib/agent-control/worker.py:ro
      - ../services/remote-worker/remote_supervisor.py:/usr/local/lib/agent-control/remote_supervisor.py:ro
      - ../services/remote-worker/resource_authority.py:/usr/local/lib/agent-control/resource_authority.py:ro
      - ../services/remote-git/helper.py:/usr/local/lib/agent-control/remote_git.py:ro
    command: [sh, -ec, 'chown 1000:1000 /projects; mkdir -p /projects/repo; chown 1000:1000 /projects/repo; exec /usr/sbin/sshd -D -e -f /fixtures/host-a/sshd_config -h /fixtures/host-a/host_key']
    depends_on:
      ssh-fixture-init: {condition: service_completed_successfully}
  ssh-host-b:
    profiles: [ssh-test]
    image: agent-control-ssh-lab:0.1.0
    user: '0:0'
    read_only: true
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    networks: [lab]
    tmpfs: ['/run:rw,nosuid,nodev,size=8m','/tmp:rw,noexec,nosuid,nodev,size=8m']
    volumes:
      - ssh-fixture-keys:/fixtures:ro
      - ssh-host-b-state:/projects
      - ../services/remote-worker/worker.py:/usr/local/lib/agent-control/worker.py:ro
      - ../services/remote-worker/remote_supervisor.py:/usr/local/lib/agent-control/remote_supervisor.py:ro
      - ../services/remote-worker/resource_authority.py:/usr/local/lib/agent-control/resource_authority.py:ro
      - ../services/remote-git/helper.py:/usr/local/lib/agent-control/remote_git.py:ro
    command: [sh, -ec, 'chown 1000:1000 /projects; mkdir -p /projects/repo; chown 1000:1000 /projects/repo; exec /usr/sbin/sshd -D -e -f /fixtures/host-b/sshd_config -h /fixtures/host-b/host_key']
    depends_on:
      ssh-fixture-init: {condition: service_completed_successfully}
  ssh-controller:
    profiles: [ssh-test]
    image: agent-control-ssh-lab:0.1.0
    init: true
    user: '${AC_LAB_UID:-1000}:${AC_LAB_GID:-1000}'
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    networks: [lab]
    working_dir: /workspace
    volumes: ['..:/workspace','ssh-fixture-keys:/fixtures:ro']
    environment:
      AC_TEST_DATABASE_URL: postgresql://ac_lab:synthetic-lab-only@db:5432/ac_implementation_test
      AC_SSH_FIXTURE_ROOT: /fixtures
    command: [sleep, infinity]
    depends_on:
      db: {condition: service_healthy}
      ssh-host-a: {condition: service_started}
      ssh-host-b: {condition: service_started}
  remote-fixture:
    profiles: [remote-test]
    image: python@sha256:d6e4d224f70f9e0172a06a3a2eba2f768eb146811a349278b38fff3a36463b47
    user: '${AC_LAB_UID:-1000}:${AC_LAB_GID:-1000}'
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    network_mode: none
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,nodev,size=64m']
    mem_limit: 256m
    working_dir: /workspace
    volumes: ['..:/workspace:ro']
    command: [python3, tests/remote_worker_test.py]
  db:
    image: postgres@sha256:4327b9fd295502f326f44153a1045a7170ddbfffed1c3829798328556cfd09e2
    environment:
      POSTGRES_USER: ac_lab
      POSTGRES_PASSWORD: synthetic-lab-only
      POSTGRES_DB: ac_implementation_test
    networks: [lab]
    volumes: [pg-data:/var/lib/postgresql/data]
    mem_limit: 384m
    cpus: 1
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U ac_lab -d ac_implementation_test']
      interval: 2s
      timeout: 2s
      retries: 30
  runtime:
    image: agent-control-lab:0.1.0
    init: true
    user: '${AC_LAB_UID:-1000}:${AC_LAB_GID:-1000}'
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 3g
    cpus: 3
    networks: [lab]
    working_dir: /workspace
    command: [sleep, infinity]
    environment:
      HOME: /workspace/.state/home
      AC_TEST_DATABASE_URL: postgresql://ac_lab:synthetic-lab-only@db:5432/ac_implementation_test
      CEZ_AUTONAME: '0'
      CEZ_AUTOMATIONS: '0'
      CEZ_SKILLS_AUTO_UPDATE: '0'
      CEZ_TELEMETRY: '0'
      CEZ_NO_BANNER: '1'
      DO_NOT_TRACK: '1'
      CI: '1'
    volumes: ['..:/workspace']
    depends_on:
      db: {condition: service_healthy}
  sandbox-db:
    profiles: [sandbox-test]
    image: postgres@sha256:4327b9fd295502f326f44153a1045a7170ddbfffed1c3829798328556cfd09e2
    environment:
      POSTGRES_USER: ac_lab
      POSTGRES_PASSWORD: synthetic-sandbox-only
      POSTGRES_DB: ac_sandbox_test
    networks: [lab]
    volumes: [sandbox-pg:/var/lib/postgresql/data]
    mem_limit: 384m
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U ac_lab -d ac_sandbox_test']
      interval: 2s
      timeout: 2s
      retries: 30
  sandbox-broker:
    profiles: [sandbox-test]
    image: agent-control-lab:0.1.0
    user: '0:0'
    init: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    networks: [lab]
    working_dir: ${AC_LAB_PROJECT_DIR:-/home/app/projects/agent-control-implementation}
    command: [node, services/sandbox-broker/main.mjs]
    environment:
      AC_SANDBOX_DATABASE_URL: postgresql://ac_lab:synthetic-sandbox-only@sandbox-db:5432/ac_sandbox_test
      AC_SANDBOX_HOST_ROOT: ${AC_LAB_PROJECT_DIR:-/home/app/projects/agent-control-implementation}/.state/sandbox
      AC_SANDBOX_PROBE: ${AC_LAB_PROJECT_DIR:-/home/app/projects/agent-control-implementation}/scripts/sandbox-probe.mjs
      AC_SANDBOX_PROBE_SHA256: ffbcfcb6bbaec702ff886ed0d72d4458265ad0e8410dd1d5d9b4c70eec2fba66
      AC_SANDBOX_IMPLEMENTATION: ${AC_LAB_PROJECT_DIR:-/home/app/projects/agent-control-implementation}/scripts/synthetic-worker.mjs
      AC_SANDBOX_IMPLEMENTATION_SHA256: f019c0cb891f6b1891e6f5589a007e41a95b4c83ae0d3468921417545d0fbc4b
      AC_SANDBOX_VERIFICATION: ${AC_LAB_PROJECT_DIR:-/home/app/projects/agent-control-implementation}/scripts/sandbox-verifier.mjs
      AC_SANDBOX_VERIFICATION_SHA256: 5f648bd2e30bd4188fc8c73cfd79bfdf0702759593e6046403234b6f49683015
      AC_SANDBOX_VERIFIER: ${AC_LAB_PROJECT_DIR:-/home/app/projects/agent-control-implementation}/scripts/synthetic-verifier.mjs
      AC_SANDBOX_WIDE_VERIFIER: ${AC_LAB_PROJECT_DIR:-/home/app/projects/agent-control-implementation}/scripts/synthetic-verifier-wide.mjs
      AC_SANDBOX_WIDE_VERIFIER_SHA256: eb9eeb85bcdf686741dcdca6c406708d5708b38a42dc4143a5fd3faa25edacbd
      AC_SANDBOX_SPECIALIST: ${AC_LAB_PROJECT_DIR:-/home/app/projects/agent-control-implementation}/scripts/synthetic-specialist.mjs
      AC_SANDBOX_SPECIALIST_SHA256: dd1316dcc69608c535d9056aca2acb2e1a6df377e4d22ea37f726d64a2da4dc6
      AC_SANDBOX_VERIFIER_SHA256: e43333eb2436790d76d3d37d9e5a27f140eba92b69804f5854f190a2663b3968
      AC_SANDBOX_IMAGE: sha256:9914706a4d692f9e87c9c17313efbf3f0544574e1ebc3ddf77512a54eb5cb7b3
    volumes:
      - ..:${AC_LAB_PROJECT_DIR:-/home/app/projects/agent-control-implementation}:ro
      - ../.state/sandbox:${AC_LAB_PROJECT_DIR:-/home/app/projects/agent-control-implementation}/.state/sandbox:rw
      - broker-socket:/run/ac-broker
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      sandbox-db: {condition: service_healthy}
  sandbox-client:
    profiles: [sandbox-test]
    image: agent-control-lab:0.1.0
    init: true
    user: '${AC_LAB_UID:-1000}:${AC_LAB_GID:-1000}'
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    networks: [lab]
    working_dir: /workspace
    command: [sleep, infinity]
    environment:
      AC_SANDBOX_DATABASE_URL: postgresql://ac_lab:synthetic-sandbox-only@sandbox-db:5432/ac_sandbox_test
      AC_ISOLATED_ENGINEERING: '1'
      HOME: /workspace/.state/home
    volumes: ['..:/workspace','broker-socket:/run/ac-broker']
    depends_on:
      sandbox-db: {condition: service_healthy}
      sandbox-broker: {condition: service_started}
networks:
  lab: {internal: true}
  native-pair: {internal: true}
volumes:
  pg-data:
  sandbox-pg:
  broker-socket:

  ssh-fixture-keys:
  ssh-host-a-state:
  ssh-host-b-state:
