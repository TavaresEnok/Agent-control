name: ac-implementation
services:
  ssh-fixture-init:
    profiles: [ssh-test]
    image: agent-control-ssh-lab:0.1.0
    user: '0:0'
    network_mode: none
    volumes: ['..:/workspace:ro','ssh-fixture-keys:/fixtures']
    working_dir: /workspace
    command: [node, scripts/prepare-ssh-fixtures.mjs]
  ssh-host-a:
    profiles: [ssh-test]
    image: agent-control-ssh-lab:0.1.0
    user: '0:0'
    read_only: true
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    networks: [lab]
    tmpfs: ['/run:rw,nosuid,nodev,size=8m','/tmp:rw,noexec,nosuid,nodev,size=8m']
    volumes:
      - ssh-fixture-keys:/fixtures:ro
      - ssh-host-a-state:/projects
      - ../services/remote-worker/worker.py:/usr/local/lib/agent-control/worker.py:ro
      - ../services/remote-git/helper.py:/usr/local/lib/agent-control/remote_git.py:ro
    command: [sh, -ec, 'chown 1000:1000 /projects; mkdir -p /projects/repo; chown 1000:1000 /projects/repo; exec /usr/sbin/sshd -D -e -f /fixtures/host-a/sshd_config -h /fixtures/host-a/host_key']
    depends_on:
      ssh-fixture-init: {condition: service_completed_successfully}
  ssh-host-b:
    profiles: [ssh-test]
    image: agent-control-ssh-lab:0.1.0
    user: '0:0'
    read_only: true
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    networks: [lab]
    tmpfs: ['/run:rw,nosuid,nodev,size=8m','/tmp:rw,noexec,nosuid,nodev,size=8m']
    volumes:
      - ssh-fixture-keys:/fixtures:ro
      - ssh-host-b-state:/projects
      - ../services/remote-worker/worker.py:/usr/local/lib/agent-control/worker.py:ro
      - ../services/remote-git/helper.py:/usr/local/lib/agent-control/remote_git.py:ro
    command: [sh, -ec, 'chown 1000:1000 /projects; mkdir -p /projects/repo; chown 1000:1000 /projects/repo; exec /usr/sbin/sshd -D -e -f /fixtures/host-b/sshd_config -h /fixtures/host-b/host_key']
    depends_on:
      ssh-fixture-init: {condition: service_completed_successfully}
  ssh-controller:
    profiles: [ssh-test]
    image: agent-control-ssh-lab:0.1.0
    init: true
    user: '${AC_LAB_UID:-1000}:${AC_LAB_GID:-1000}'
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    networks: [lab]
    working_dir: /workspace
    volumes: ['..:/workspace','ssh-fixture-keys:/fixtures:ro']
    environment:
      AC_TEST_DATABASE_URL: postgresql://ac_lab:synthetic-lab-only@db:5432/ac_implementation_test
      AC_SSH_FIXTURE_ROOT: /fixtures
    command: [sleep, infinity]
    depends_on:
      db: {condition: service_healthy}
      ssh-host-a: {condition: service_started}
      ssh-host-b: {condition: service_started}
  remote-fixture:
    profiles: [remote-test]
    image: python@sha256:d6e4d224f70f9e0172a06a3a2eba2f768eb146811a349278b38fff3a36463b47
    user: '${AC_LAB_UID:-1000}:${AC_LAB_GID:-1000}'
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    network_mode: none
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,nodev,size=64m']
    mem_limit: 256m
    working_dir: /workspace
    volumes: ['..:/workspace:ro']
    command: [python3, tests/remote_worker_test.py]
  db:
    image: postgres@sha256:4327b9fd295502f326f44153a1045a7170ddbfffed1c3829798328556cfd09e2
    environment:
      POSTGRES_USER: ac_lab
      POSTGRES_PASSWORD: synthetic-lab-only
      POSTGRES_DB: ac_implementation_test
    networks: [lab]
    volumes: [pg-data:/var/lib/postgresql/data]
    mem_limit: 384m
    cpus: 1
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U ac_lab -d ac_implementation_test']
      interval: 2s
      timeout: 2s
      retries: 30
  runtime:
    image: agent-control-lab:0.1.0
    init: true
    user: '${AC_LAB_UID:-1000}:${AC_LAB_GID:-1000}'
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 3g
    cpus: 3
    networks: [lab]
    working_dir: /workspace
    command: [sleep, infinity]
    environment:
      HOME: /workspace/.state/home
      AC_TEST_DATABASE_URL: postgresql://ac_lab:synthetic-lab-only@db:5432/ac_implementation_test
      CEZ_AUTONAME: '0'
      CEZ_AUTOMATIONS: '0'
      CEZ_SKILLS_AUTO_UPDATE: '0'
      CEZ_TELEMETRY: '0'
      CEZ_NO_BANNER: '1'
      DO_NOT_TRACK: '1'
      CI: '1'
    volumes: ['..:/workspace']
    depends_on:
      db: {condition: service_healthy}
  sandbox-db:
    profiles: [sandbox-test]
    image: postgres@sha256:4327b9fd295502f326f44153a1045a7170ddbfffed1c3829798328556cfd09e2
    environment:
      POSTGRES_USER: ac_lab
      POSTGRES_PASSWORD: synthetic-sandbox-only
      POSTGRES_DB: ac_sandbox_test
    networks: [lab]
    volumes: [sandbox-pg:/var/lib/postgresql/data]
    mem_limit: 384m
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U ac_lab -d ac_sandbox_test']
      interval: 2s
      timeout: 2s
      retries: 30
  sandbox-broker:
    profiles: [sandbox-test]
    image: agent-control-lab:0.1.0
    user: '0:0'
    init: true
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    networks: [lab]
    working_dir: /home/app/projects/agent-control-implementation
    command: [node, services/sandbox-broker/main.mjs]
    environment:
      AC_SANDBOX_DATABASE_URL: postgresql://ac_lab:synthetic-sandbox-only@sandbox-db:5432/ac_sandbox_test
      AC_SANDBOX_HOST_ROOT: /home/app/projects/agent-control-implementation/.state/sandbox
      AC_SANDBOX_PROBE: /home/app/projects/agent-control-implementation/scripts/sandbox-probe.mjs
      AC_SANDBOX_PROBE_SHA256: ffbcfcb6bbaec702ff886ed0d72d4458265ad0e8410dd1d5d9b4c70eec2fba66
      AC_SANDBOX_IMPLEMENTATION: /home/app/projects/agent-control-implementation/scripts/synthetic-worker.mjs
      AC_SANDBOX_IMPLEMENTATION_SHA256: 69fec5c252c65279d60f06ff93ac087438a0a00789dd840a7b5ac76cbb97db1f
      AC_SANDBOX_VERIFICATION: /home/app/projects/agent-control-implementation/scripts/sandbox-verifier.mjs
      AC_SANDBOX_VERIFICATION_SHA256: 4817e0aad40cc1e16830314c87e095d4e70b1bd01fee3342829eea3dc12b3f2d
      AC_SANDBOX_VERIFIER: /home/app/projects/agent-control-implementation/scripts/synthetic-verifier.mjs
      AC_SANDBOX_VERIFIER_SHA256: 66f05e612ac165f2532cf924efc20b346db2d5569e967a393de214096d53a96c
      AC_SANDBOX_IMAGE: sha256:9914706a4d692f9e87c9c17313efbf3f0544574e1ebc3ddf77512a54eb5cb7b3
    volumes:
      - ..:/home/app/projects/agent-control-implementation:ro
      - ../.state/sandbox:/home/app/projects/agent-control-implementation/.state/sandbox:rw
      - broker-socket:/run/ac-broker
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      sandbox-db: {condition: service_healthy}
  sandbox-client:
    profiles: [sandbox-test]
    image: agent-control-lab:0.1.0
    init: true
    user: '${AC_LAB_UID:-1000}:${AC_LAB_GID:-1000}'
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    networks: [lab]
    working_dir: /workspace
    command: [sleep, infinity]
    environment:
      AC_SANDBOX_DATABASE_URL: postgresql://ac_lab:synthetic-sandbox-only@sandbox-db:5432/ac_sandbox_test
      AC_ISOLATED_ENGINEERING: '1'
      HOME: /workspace/.state/home
    volumes: ['..:/workspace','broker-socket:/run/ac-broker']
    depends_on:
      sandbox-db: {condition: service_healthy}
      sandbox-broker: {condition: service_started}
networks:
  lab: {internal: true}
volumes:
  pg-data:
  sandbox-pg:
  broker-socket:

  ssh-fixture-keys:
  ssh-host-a-state:
  ssh-host-b-state:
