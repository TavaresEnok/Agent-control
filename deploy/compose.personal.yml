# Uso pessoal, um titular. Sobe de novo sozinho depois de um reboot.
#
# Antes de subir, defina uma senha própria do banco, sem valor padrão conhecido:
#   export AC_PERSONAL_DB_PASSWORD="$(openssl rand -hex 24)"
# O compose recusa subir sem ela e a mesma senha precisa estar na databaseUrl da instalação.
name: agent-control-personal
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ac
      POSTGRES_PASSWORD: ${AC_PERSONAL_DB_PASSWORD:?defina AC_PERSONAL_DB_PASSWORD com uma senha própria; não existe senha padrão}
      POSTGRES_DB: agent_control
    # Só o gateway alcança o banco. O broker do Docker não está nesta rede.
    networks: [data]
    volumes: [pg-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ac -d agent_control"]
      interval: 5s
      timeout: 3s
      retries: 20
  broker:
    image: alpine/socat
    restart: unless-stopped
    # LIMITAÇÃO CONHECIDA: este broker é só um encaminhador TCP para o socket do Docker. Ele não autentica quem chama e
    # não filtra operações: quem alcançar a porta 2375 controla o daemon inteiro (criar contêineres com qualquer imagem,
    # montagem ou rede). Para um único titular isso é aceitável porque:
    #   - a porta não é publicada no host e só a rede interna `control` a alcança, onde só o gateway está;
    #   - o broker não está na rede do banco, nem na rede de saída, e não recebe credenciais;
    #   - os workers não recebem o socket.
    # Não ligue outro serviço à rede `control`. Um broker que valide imagem, montagem, rede e dono de cada job exige código
    # próprio e ainda não existe; até lá, a proteção é o isolamento de rede acima.
    command: ["TCP-LISTEN:2375,fork,reuseaddr", "UNIX-CONNECT:/var/run/docker.sock"]
    networks: [control]
    security_opt: [no-new-privileges:true]
    volumes: ["/var/run/docker.sock:/var/run/docker.sock"]
  gateway:
    build: {context: .., dockerfile: deploy/Dockerfile.personal}
    restart: unless-stopped
    working_dir: /workspace
    command: ["node", "--import", "tsx", "src/server-main.ts", "serve", "/data/installation.json"]
    environment:
      DOCKER_HOST: tcp://broker:2375
    # Único serviço nas duas redes internas: banco (data) e broker (control). A rede padrão mantém a saída para fora.
    networks: [default, data, control]
    volumes:
      - ..:/workspace
      - ac-data:/data
    depends_on:
      db: {condition: service_healthy}
      broker: {condition: service_started}
  provider-egress:
    build: {context: .., dockerfile: deploy/Dockerfile.provider-egress}
    image: agent-control-provider-egress:0.1.0
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks:
      provider: {aliases: [provider-egress]}
      outbound: {}
volumes:
  pg-data:
  ac-data:
networks:
  provider:
    name: ac-native-provider
    internal: true
  outbound: {}
  # Redes internas e separadas: nenhuma sai para fora e nenhum serviço, além do gateway, está em mais de uma.
  data:
    internal: true
  control:
    internal: true
